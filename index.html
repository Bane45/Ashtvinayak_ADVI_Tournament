<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cricket Tournament Manager</title>

<style>
body{
font-family:Segoe UI;
margin:0;
background:#eef2f7;
}

header{
background:#0d6efd;
color:white;
padding:15px;
text-align:center;
font-size:24px;
font-weight:bold;
}

nav{
display:flex;
background:white;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

nav button{
flex:1;
padding:12px;
border:none;
background:white;
font-size:16px;
cursor:pointer;
}

nav button:hover{
background:#e9ecef;
}

.container{
padding:20px;
max-width:1100px;
margin:auto;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

h2{margin-top:0}

input,select{
width:100%;
padding:8px;
margin:6px 0;
}

button.action{
background:#0d6efd;
color:white;
border:none;
padding:10px;
border-radius:6px;
cursor:pointer;
}

.score-btn{
padding:15px;
margin:4px;
font-size:18px;
width:60px;
}

.big-score{
font-size:28px;
font-weight:bold;
color:#0d6efd;
}

.hidden{display:none}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}
</style>
</head>

<body>

<header>Cricket Tournament Pro Manager</header>

<nav>
<button onclick="showPage('teams')">Team Registration</button>
<button onclick="showPage('match')">Match Setup</button>
<button onclick="showPage('live')">Live Scorecard</button>
<button onclick="showPage('points')">Points Table</button>
</nav>

<div class="container">

<!-- ================= TEAM REGISTRATION ================= -->
<div id="teamsPage" class="card">
<h2>Register Team</h2>
<input id="teamName" placeholder="Team name">
<button class="action" onclick="addTeam()">Add Team</button>

<h3>Teams</h3>
<ul id="teamList"></ul>
</div>


<!-- ================= MATCH SETUP ================= -->
<div id="matchPage" class="card hidden">
<h2>Match Setup</h2>

<label>Batting Team</label>
<select id="battingTeam"></select>

<label>Bowling Team</label>
<select id="bowlingTeam"></select>

<label>Striker</label>
<input id="striker">

<label>Non Striker</label>
<input id="nonStriker">

<label>Opening Bowler</label>
<input id="bowler">

<button class="action" onclick="startMatch()">Start Match</button>

<h3 id="matchInfo"></h3>
</div>


<!-- ================= LIVE SCORE ================= -->
<div id="livePage" class="card hidden">

<h2>Live Scorecard</h2>

<div class="big-score" id="scoreDisplay">0/0 (0.0)</div>

<p id="playersDisplay"></p>

<h3>Runs</h3>

<button class="score-btn" onclick="run(0)">0</button>
<button class="score-btn" onclick="run(1)">1</button>
<button class="score-btn" onclick="run(2)">2</button>
<button class="score-btn" onclick="run(3)">3</button>
<button class="score-btn" onclick="run(4)">4</button>
<button class="score-btn" onclick="run(6)">6</button>
<button class="score-btn" onclick="wicket()">W</button>

<br><br>

<button class="action" onclick="endOver()">End Over</button>

<h3>Match Awards</h3>
<input id="mom" placeholder="Man of the match">
<button class="action" onclick="finishMatch()">Finish Match</button>

</div>


<!-- ================= POINTS ================= -->
<div id="pointsPage" class="card hidden">

<h2>Points Table</h2>

<table>
<thead>
<tr>
<th>Team</th>
<th>Wins</th>
</tr>
</thead>
<tbody id="pointsTable"></tbody>
</table>

<h3 id="bestBatsman"></h3>
<h3 id="bestBowler"></h3>

</div>

</div>


<script>

let teams=[]
let points={}
let totalRuns=0
let wickets=0
let balls=0
let overs=0
let strikerRuns=0
let strikerBalls=0
let fours=0
let sixes=0

let match={
batting:"",
bowling:"",
striker:"",
nonStriker:"",
bowler:""
}

function showPage(p){
document.getElementById("teamsPage").classList.add("hidden")
document.getElementById("matchPage").classList.add("hidden")
document.getElementById("livePage").classList.add("hidden")
document.getElementById("pointsPage").classList.add("hidden")

if(p=="teams") document.getElementById("teamsPage").classList.remove("hidden")
if(p=="match") document.getElementById("matchPage").classList.remove("hidden")
if(p=="live") document.getElementById("livePage").classList.remove("hidden")
if(p=="points") document.getElementById("pointsPage").classList.remove("hidden")
}


function addTeam(){
let name=document.getElementById("teamName").value
if(!name) return
teams.push(name)
points[name]=points[name]||0
renderTeams()
loadMatchTeams()
}

function renderTeams(){
let html=""
teams.forEach(t=> html+="<li>"+t+"</li>")
document.getElementById("teamList").innerHTML=html
}

function loadMatchTeams(){
let b=document.getElementById("battingTeam")
let bw=document.getElementById("bowlingTeam")
b.innerHTML=""
bw.innerHTML=""
teams.forEach(t=>{
b.innerHTML+=`<option>${t}</option>`
bw.innerHTML+=`<option>${t}</option>`
})
}


function startMatch(){
match.batting=document.getElementById("battingTeam").value
match.bowling=document.getElementById("bowlingTeam").value
match.striker=document.getElementById("striker").value
match.nonStriker=document.getElementById("nonStriker").value
match.bowler=document.getElementById("bowler").value

document.getElementById("matchInfo").innerText=
match.batting+" batting vs "+match.bowling

updateDisplay()
showPage("live")
}


function run(r){
totalRuns+=r
strikerRuns+=r
strikerBalls++
balls++

if(r==4) fours++
if(r==6) sixes++

if(balls==6) endOver()

updateDisplay()
}

function wicket(){
wickets++
balls++
strikerBalls++
updateDisplay()
}

function endOver(){
overs++
balls=0
alert("Over completed")
updateDisplay()
}

function updateDisplay(){
document.getElementById("scoreDisplay").innerText=
totalRuns+"/"+wickets+" ("+overs+"."+balls+")"

document.getElementById("playersDisplay").innerText=
"Striker: "+match.striker+" "+strikerRuns+"("+strikerBalls+") | Bowler: "+match.bowler
}


function finishMatch(){

let winner=prompt("Winner team name")
points[winner]++

renderPoints()

document.getElementById("bestBatsman").innerText=
"Best Batsman: "+match.striker+" "+strikerRuns+" runs"

document.getElementById("bestBowler").innerText=
"Best Bowler: "+match.bowler

showPage("points")
}


function renderPoints(){
let html=""
Object.entries(points).forEach(([t,w])=>{
html+=`<tr><td>${t}</td><td>${w}</td></tr>`
})
document.getElementById("pointsTable").innerHTML=html
}

</script>

</body>
</html>
