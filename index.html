<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cricket Knockout Tournament</title>

<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
margin:0;
}

header{
background:#1e293b;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

nav{
display:flex;
background:#334155;
}

nav button{
flex:1;
padding:12px;
border:none;
background:#334155;
color:white;
cursor:pointer;
font-size:15px;
}

nav button:hover{
background:#475569;
}

section{
display:none;
padding:20px;
}

.active{
display:block;
}

.card{
background:#1e293b;
padding:15px;
border-radius:8px;
margin-bottom:15px;
}

input,select{
padding:8px;
margin:5px;
border-radius:6px;
border:none;
}

button.action{
background:#22c55e;
border:none;
padding:8px 12px;
border-radius:6px;
cursor:pointer;
color:white;
}

h3{
margin-top:0;
}
</style>
</head>

<body>

<header>🏏 Cricket Knockout Tournament</header>

<nav>
<button onclick="show('teams')">Teams</button>
<button onclick="show('match')">Match Setup</button>
<button onclick="show('score')">Scorebook</button>
<button onclick="show('knockout')">Knockout</button>
<button onclick="show('results')">Results</button>
</nav>

<!-- TEAM REGISTER -->
<section id="teams" class="active">
<div class="card">
<h3>Register Team</h3>
<input id="teamName" placeholder="Team name">
<button class="action" onclick="addTeam()">Add Team</button>
</div>

<div class="card">
<h3>Teams</h3>
<ul id="teamList"></ul>
</div>
</section>

<!-- MATCH SETUP -->
<section id="match">
<div class="card">
<h3>Create Match</h3>

<select id="teamA"></select>
<select id="teamB"></select>

<br>

<input id="batsman1" placeholder="Batsman 1">
<input id="batsman2" placeholder="Batsman 2">
<input id="bowler" placeholder="Bowler">

<br>

<button class="action" onclick="startMatch()">Start Match</button>
</div>
</section>

<!-- SCOREBOOK -->
<section id="score">
<div class="card">
<h3>Score Entry (Manual)</h3>

<p id="matchInfo"></p>

Team A Score <input id="scoreA" type="number">
Team B Score <input id="scoreB" type="number">

<br><br>

Batsman 1 Runs <input id="runs1" type="number">
Batsman 2 Runs <input id="runs2" type="number">
Bowler Wickets <input id="wkts" type="number">

<br><br>

Man of Match <input id="mom">
Best Batsman <input id="bestBat">
Best Bowler <input id="bestBowl">

<br><br>

<button class="action" onclick="finishMatch()">Finish Match</button>
</div>
</section>

<!-- KNOCKOUT -->
<section id="knockout">
<div class="card">
<h3>Knockout Progress</h3>
<div id="knockoutView"></div>
</div>
</section>

<!-- RESULTS -->
<section id="results">
<div class="card">
<h3>Match Results</h3>
<div id="resultsList"></div>
</div>
</section>

<script>

let teams=JSON.parse(localStorage.getItem("teams"))||[]
let matches=JSON.parse(localStorage.getItem("matches"))||[]
let currentMatch=null
let knockout=JSON.parse(localStorage.getItem("knockout"))||[]

function save(){
localStorage.setItem("teams",JSON.stringify(teams))
localStorage.setItem("matches",JSON.stringify(matches))
localStorage.setItem("knockout",JSON.stringify(knockout))
}

function show(id){
document.querySelectorAll("section").forEach(s=>s.classList.remove("active"))
document.getElementById(id).classList.add("active")
render()
}

function addTeam(){
let name=document.getElementById("teamName").value
if(!name)return
teams.push(name)
document.getElementById("teamName").value=""
save()
render()
}

function render(){
document.getElementById("teamList").innerHTML=
teams.map(t=>"<li>"+t+"</li>").join("")

document.getElementById("teamA").innerHTML=
teams.map(t=>"<option>"+t+"</option>").join("")
document.getElementById("teamB").innerHTML=
teams.map(t=>"<option>"+t+"</option>").join("")

document.getElementById("resultsList").innerHTML=
matches.map(m=>`
<div class="card">
${m.a} ${m.sa} vs ${m.b} ${m.sb}
<br>Winner: ${m.winner}
<br>MOM: ${m.mom}
</div>`).join("")

document.getElementById("knockoutView").innerHTML=
knockout.map((t,i)=>"Match "+(i+1)+": "+t).join("<br>")
}

function startMatch(){
currentMatch={
a:teamA.value,
b:teamB.value,
bat1:batsman1.value,
bat2:batsman2.value,
bowler:bowler.value
}

matchInfo.innerText=
currentMatch.a+" vs "+currentMatch.b+
" | "+currentMatch.bat1+" & "+currentMatch.bat2+
" vs "+currentMatch.bowler

show("score")
}

function finishMatch(){

currentMatch.sa=scoreA.value
currentMatch.sb=scoreB.value
currentMatch.r1=runs1.value
currentMatch.r2=runs2.value
currentMatch.w=wkts.value
currentMatch.mom=mom.value
currentMatch.bestBat=bestBat.value
currentMatch.bestBowl=bestBowl.value

currentMatch.winner =
currentMatch.sa>currentMatch.sb ? currentMatch.a : currentMatch.b

matches.push(currentMatch)
knockout.push(currentMatch.winner)

save()
render()
alert("Winner: "+currentMatch.winner)
show("knockout")
}

render()

</script>
</body>
</html>
