<!DOCTYPE html>
<html>
<head>
<title>Cricket Tournament Manager</title>

<style>
body{
  font-family: Arial;
  padding:20px;
}

.page{
  display:none;
}

button{
  padding:10px;
  margin:5px;
  font-size:16px;
}

.runs button{
  width:60px;
  height:60px;
  font-size:20px;
}

.menu button{
  font-size:18px;
  display:block;
  margin:10px 0;
}
</style>

</head>

<body>

<h1>Cricket Tournament Manager</h1>

<!-- ================= MENU ================= -->
<div class="menu">
<button onclick="showPage('home')">Home</button>
<button onclick="showPage('teams')">Register Teams</button>
<button onclick="showPage('match')">Create Match</button>
<button onclick="showPage('live')">Live Scoring</button>
<button onclick="showPage('summary')">Match Summary</button>
</div>

<hr>

<!-- ================= HOME ================= -->
<div id="home" class="page">
<h2>Welcome</h2>
<p>Use menu to manage tournament</p>
</div>

<!-- ================= TEAM REG ================= -->
<div id="teams" class="page">
<h2>Register Team</h2>

<input id="teamName" placeholder="Team name">
<button onclick="addTeam()">Add Team</button>

<h3>Registered Teams</h3>
<ul id="teamList"></ul>
</div>

<!-- ================= CREATE MATCH ================= -->
<div id="match" class="page">
<h2>Create Match</h2>

<label>Team 1</label><br>
<select id="team1"></select><br><br>

<label>Team 2</label><br>
<select id="team2"></select><br><br>

<button onclick="createMatch()">Start Match</button>
</div>

<!-- ================= LIVE SCORING ================= -->
<div id="live" class="page">
<h2>Live Scoring</h2>

<h3 id="matchTeams"></h3>

<input id="striker" placeholder="Striker name">

<div class="runs">
<button onclick="run(0)">0</button>
<button onclick="run(1)">1</button>
<button onclick="run(2)">2</button>
<button onclick="run(3)">3</button>
<button onclick="run(4)">4</button>
<button onclick="run(6)">6</button>
<button onclick="wicket()">W</button>
</div>

<h3 id="score"></h3>
<h4 id="balls"></h4>

<button onclick="endOver()">End Over</button>
</div>

<!-- ================= SUMMARY ================= -->
<div id="summary" class="page">
<h2>Match Summary</h2>
<div id="summaryData"></div>
</div>


<script>

showPage("home")

function showPage(id){
  document.querySelectorAll(".page").forEach(p=>p.style.display="none")
  document.getElementById(id).style.display="block"

  if(id==="teams") loadTeams()
  if(id==="match") loadTeamDropdowns()
  if(id==="live") loadMatch()
  if(id==="summary") showSummary()
}


/* ================= TEAM STORAGE ================= */

function addTeam(){
  const name=document.getElementById("teamName").value
  if(!name) return

  let teams=JSON.parse(localStorage.getItem("teams"))||[]
  teams.push(name)
  localStorage.setItem("teams",JSON.stringify(teams))
  document.getElementById("teamName").value=""
  loadTeams()
}

function loadTeams(){
  const list=document.getElementById("teamList")
  if(!list) return

  let teams=JSON.parse(localStorage.getItem("teams"))||[]
  list.innerHTML=""

  teams.forEach(t=>{
    let li=document.createElement("li")
    li.innerText=t
    list.appendChild(li)
  })
}

function loadTeamDropdowns(){
  team1.innerHTML=""
  team2.innerHTML=""

  let teams=JSON.parse(localStorage.getItem("teams"))||[]

  teams.forEach(t=>{
    team1.add(new Option(t,t))
    team2.add(new Option(t,t))
  })
}


/* ================= MATCH CREATE ================= */

function createMatch(){

  const match={
    team1:team1.value,
    team2:team2.value,
    score:0,
    wickets:0,
    balls:[],
    overs:0
  }

  localStorage.setItem("match",JSON.stringify(match))
  alert("Match Created. Go to Live Scoring")
}


/* ================= LIVE SCORING ================= */

let matchData

function loadMatch(){
  matchData=JSON.parse(localStorage.getItem("match"))

  if(!matchData){
    alert("Create match first")
    return
  }

  matchTeams.innerText=matchData.team1+" vs "+matchData.team2
  updateScore()
}

function run(r){
  matchData.score+=r
  matchData.balls.push(r)
  updateScore()
}

function wicket(){
  matchData.wickets++
  matchData.balls.push("W")
  updateScore()
}

function updateScore(){
  score.innerText="Score: "+matchData.score+"/"+matchData.wickets
  balls.innerText="This Over: "+matchData.balls.join(" , ")
  localStorage.setItem("match",JSON.stringify(matchData))
}

function endOver(){
  matchData.overs++
  matchData.balls=[]
  updateScore()
}


/* ================= SUMMARY ================= */

function showSummary(){
  const m=JSON.parse(localStorage.getItem("match"))
  if(!m) return

  summaryData.innerHTML=
    "Match: "+m.team1+" vs "+m.team2+
    "<br>Total Score: "+m.score+
    "<br>Wickets: "+m.wickets+
    "<br>Overs: "+m.overs
}

</script>

</body>
</html>
