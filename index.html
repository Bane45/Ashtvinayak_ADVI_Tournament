<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Knockout Cricket Tournament</title>

<style>
body{font-family:Segoe UI;margin:0;background:#eef2f7}
header{background:#0d6efd;color:white;padding:15px;text-align:center;font-size:22px;font-weight:bold}
nav{display:flex;background:white;box-shadow:0 2px 6px rgba(0,0,0,0.1)}
nav button{flex:1;padding:12px;border:none;background:white;font-size:16px;cursor:pointer}
nav button:hover{background:#e9ecef}
.container{max-width:1100px;margin:auto;padding:20px}
.card{background:white;padding:20px;margin-bottom:20px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.hidden{display:none}
.score{font-size:32px;font-weight:bold;color:#0d6efd}
.score-btn{padding:14px;margin:4px;font-size:18px;width:60px}
input,select{width:100%;padding:8px;margin:6px 0}
button.primary{background:#0d6efd;color:white;border:none;padding:10px;border-radius:6px;cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
</style>
</head>

<body>

<header>Knockout Cricket Tournament</header>

<nav>
<button onclick="page('teams')">Teams</button>
<button onclick="page('setup')">Match Setup</button>
<button onclick="page('live')">Live Match</button>
<button onclick="page('points')">Points</button>
</nav>

<div class="container">

<!-- TEAM PAGE -->
<div id="teams" class="card">
<h2>Register Teams</h2>
<input id="teamInput" placeholder="Team name">
<button class="primary" onclick="addTeam()">Add Team</button>
<button class="primary" onclick="generateKnockout()">Generate Knockout</button>
<ul id="teamList"></ul>
</div>

<!-- MATCH SETUP -->
<div id="setup" class="card hidden">
<h2>Match Setup</h2>

<label>Striker</label>
<input id="s1">

<label>Non Striker</label>
<input id="s2">

<label>Opening Bowler</label>
<input id="bowler">

<button class="primary" onclick="startMatch()">Start Match</button>

<h3 id="matchInfo"></h3>
</div>

<!-- LIVE MATCH -->
<div id="live" class="card hidden">

<h2 id="roundTitle"></h2>
<h3 id="inningsTitle"></h3>
<div class="score" id="score">0/0 (0.0)</div>
<div id="target"></div>
<p id="players"></p>

<button class="score-btn" onclick="ball(0)">0</button>
<button class="score-btn" onclick="ball(1)">1</button>
<button class="score-btn" onclick="ball(2)">2</button>
<button class="score-btn" onclick="ball(3)">3</button>
<button class="score-btn" onclick="ball(4)">4</button>
<button class="score-btn" onclick="ball(6)">6</button>
<button class="score-btn" onclick="wicket()">W</button>

<br><br>

<button class="primary" onclick="changeBowler()">Change Bowler</button>
<button class="primary" onclick="endOver()">End Over</button>
<button class="primary" onclick="endInnings()">End Innings</button>

</div>

<!-- POINTS -->
<div id="points" class="card hidden">
<h2>Points Table</h2>
<table>
<thead><tr><th>Team</th><th>Wins</th></tr></thead>
<tbody id="pointsTable"></tbody>
</table>
<h2 id="winnerText"></h2>
</div>

</div>

<script>

function page(p){
["teams","setup","live","points"].forEach(x=>document.getElementById(x).classList.add("hidden"))
document.getElementById(p).classList.remove("hidden")
}

let teams=[]
let points={}
let knockoutMatches=[]
let currentMatch=0

let innings=1
let target=0

let match={
batting:"",
bowling:"",
striker:"",
nonStriker:"",
bowler:""
}

let score=0
let wickets=0
let balls=0
let overs=0

function addTeam(){
let t=teamInput.value.trim()
if(!t) return
teams.push(t)
points[t]=points[t]||0
renderTeams()
}

function renderTeams(){
teamList.innerHTML=teams.map(t=>"<li>"+t+"</li>").join("")
}

function generateKnockout(){

if(teams.length<2){alert("Need teams");return}

knockoutMatches=[]
let roundTeams=[...teams]

while(roundTeams.length>1){

let roundName =
roundTeams.length==2?"FINAL":
roundTeams.length<=4?"SEMI FINAL":
roundTeams.length<=8?"QUARTER FINAL":"ROUND"

let next=[]

for(let i=0;i<roundTeams.length;i+=2){
let A=roundTeams[i]
let B=roundTeams[i+1]||"BYE"
knockoutMatches.push({round:roundName,teamA:A,teamB:B,winner:""})
next.push("TBD")
}

roundTeams=next
}

currentMatch=0
showNextMatch()
page("setup")
}

function showNextMatch(){

let m=knockoutMatches[currentMatch]

match.batting=m.teamA
match.bowling=m.teamB

roundTitle.innerText=m.round+" : "+m.teamA+" vs "+m.teamB
matchInfo.innerText=m.teamA+" vs "+m.teamB
}

function startMatch(){

match.striker=s1.value
match.nonStriker=s2.value
match.bowler=bowler.value

resetScore()
updateUI()
page("live")
}

function resetScore(){
score=0
wickets=0
balls=0
overs=0
}

function ball(r){
score+=r
balls++
if(r%2==1) swapStrike()
if(balls==6) endOver()
checkChase()
updateUI()
}

function wicket(){
wickets++
balls++
match.striker=prompt("New batsman")
updateUI()
}

function swapStrike(){
let t=match.striker
match.striker=match.nonStriker
match.nonStriker=t
}

function endOver(){
overs++
balls=0
swapStrike()
changeBowler()
updateUI()
}

function changeBowler(){
match.bowler=prompt("New bowler")
}

function endInnings(){

if(innings==1){
target=score+1
innings=2

let temp=match.batting
match.batting=match.bowling
match.bowling=temp

match.striker=prompt("New striker")
match.nonStriker=prompt("New non striker")
match.bowler=prompt("New bowler")

resetScore()
updateUI()
return
}

finishMatch()
}

function checkChase(){
if(innings==2 && score>=target) finishMatch()
}

function finishMatch(){

let winner = score>=target ? match.batting : match.bowling

points[winner]++
knockoutMatches[currentMatch].winner=winner

renderPoints()

alert("Winner: "+winner)

advanceKnockout(winner)
page("points")
}

function advanceKnockout(winner){

for(let i=currentMatch+1;i<knockoutMatches.length;i++){
if(knockoutMatches[i].teamA=="TBD"){knockoutMatches[i].teamA=winner;break}
if(knockoutMatches[i].teamB=="TBD"){knockoutMatches[i].teamB=winner;break}
}

currentMatch++

if(currentMatch>=knockoutMatches.length){
winnerText.innerText="🏆 Champion: "+winner
}else{
alert("Next Match Ready")
innings=1
showNextMatch()
}
}

function renderPoints(){
pointsTable.innerHTML=
Object.entries(points).map(([t,w])=>`<tr><td>${t}</td><td>${w}</td></tr>`).join("")
}

function updateUI(){

inningsTitle.innerText="INNINGS "+innings+" | "+match.batting+" batting"

score.innerText=score+"/"+wickets+" ("+overs+"."+balls+")"

players.innerText=
"Striker: "+match.striker+
" | Non striker: "+match.nonStriker+
" | Bowler: "+match.bowler

target.innerText=innings==2?"Target: "+target:""
}

</script>
</body>
</html>
